name: Deploy routes to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "routes/**"
      - ".github/workflows/deploy-routes-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # Pages 未启用时自动开启（GitHub Actions 构建方式）
          enablement: true

      - name: Upload routes artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: routes

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
