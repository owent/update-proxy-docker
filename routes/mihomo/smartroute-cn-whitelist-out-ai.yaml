    interval: 86400
    proxy: PROXY
  "geosite-codeberg":
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/codeberg.mrs"
    path: ./ruleset/geosite-codeberg.mrs
    interval: 86400
    proxy: PROXY
  "geoip-google":
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/google.mrs"
    path: ./ruleset/geoip-google.mrs
    interval: 86400
    proxy: PROXY
  "geoip-openai":
    type: http
    behavior: ipcidr
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/ai.mrs"
    path: ./ruleset/geoip-openai.mrs
    interval: 86400
    proxy: PROXY
  "geosite-anthropic":
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/anthropic.mrs"
    path: ./ruleset/geosite-anthropic.mrs
