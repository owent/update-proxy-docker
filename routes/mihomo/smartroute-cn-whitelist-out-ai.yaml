    behavior: domain
    format: yaml
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/codeberg.yaml"
    path: ./ruleset/geosite-codeberg.yaml
    interval: 86400
    proxy: PROXY  # raw.githubusercontent.com 需经代理下载；不需要可删
  "geoip-google":
    type: http
    behavior: ipcidr
    format: yaml
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/google.yaml"
    path: ./ruleset/geoip-google.yaml
    interval: 86400
    proxy: PROXY  # raw.githubusercontent.com 需经代理下载；不需要可删
  "geoip-openai":
